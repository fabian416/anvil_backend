version: '3.8'

services:
  mcp_oneinch:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: anvil_mcp_oneinch
    command: python -m app.infrastructure.mcp.servers.oneinch_mcp
    ports:
      - "8081:8081"
    environment:
      - ONEINCH_API_KEY=${ONEINCH_API_KEY:-}
      - PYTHONPATH=/app/src
    volumes:
      - ../../src:/app/src
    restart: unless-stopped
    networks:
      - anvil_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

