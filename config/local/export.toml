# Don't rename `export` or `fields`
[export]
fields = [
    # PostgreSQL from secrets
    "postgres.USER",
    "postgres.PASSWORD",
    # PostgreSQL from config
    "postgres.DB",
    "postgres.PORT",
    # Uvicorn from config
    "uvicorn.HOST",
    "uvicorn.PORT",
    # Stripe from config (has default value)
    "stripe.STRIPE_API_KEY",
    # Admin configuration
    "admin.USER_ADMIN",
    # DeepInfra from secrets (for embeddings)
    "deepinfra.API_KEY",
    # RPC providers from secrets (for Web3 client and gas optimizer)
    "rpc.ALCHEMY_API_KEY",
    "rpc.INFURA_API_KEY",
]
