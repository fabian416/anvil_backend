# ========================================
# LLM Provider Configuration
# ========================================
[llm_provider]
# Primary provider for agent squad (vertex_ai, deepinfra)
# Note: OpenAI removed - using native Vertex AI / DeepInfra model names
primary_provider = "vertex_ai"

# Fallback provider if primary fails
fallback_provider = "deepinfra"

# Enable automatic fallback
enable_fallback = true

# Use unified LLM gateway for agent squad
use_unified_gateway = true

# ----------------------------------------
# Vertex AI Configuration (Primary)
# ----------------------------------------
[llm_provider.vertex_ai]
# Uses credentials from [vertex_ai] section in .secrets.toml
# Available models:
#   - gemini-2.0-flash-exp  (fast, cost-effective - recommended)
#   - gemini-1.5-pro        (premium, complex reasoning)
#   - gemini-1.5-flash      (balanced)
default_model = "gemini-2.0-flash-exp"

# ----------------------------------------
# DeepInfra Configuration (Fallback)
# ----------------------------------------
[llm_provider.deepinfra]
# Uses credentials from [deepinfra] section in .secrets.toml
# Available models:
#   - meta-llama/Llama-3.2-3B-Instruct       (fast, 3B params)
#   - meta-llama/Meta-Llama-3.1-70B-Instruct (standard, 70B params)
#   - meta-llama/Meta-Llama-3.1-405B-Instruct (premium, 405B params)
default_model = "meta-llama/Meta-Llama-3.1-70B-Instruct"

# Model mapping: Vertex AI names -> DeepInfra equivalents (for fallback)
[llm_provider.deepinfra.model_mapping]
"gemini-2.0-flash-exp" = "meta-llama/Meta-Llama-3.1-70B-Instruct"
"gemini-1.5-flash" = "meta-llama/Meta-Llama-3.1-70B-Instruct"
"gemini-1.5-pro" = "meta-llama/Meta-Llama-3.1-405B-Instruct"

