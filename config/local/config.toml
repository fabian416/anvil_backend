# PostgreSQL
[postgres]
DB = "anvil_db"
HOST = "localhost"
PORT = 5432
DRIVER = "psycopg"

# Uvicorn
[uvicorn]
HOST = "0.0.0.0"
PORT = 9999

# SQLAlchemy
[sqla]
ECHO = false
ECHO_POOL = false
POOL_SIZE = 50
MAX_OVERFLOW = 10

# Logs
[logs]
# Level can be set to "DEBUG", "INFO", "WARNING", "ERROR", "CRITICAL"
LEVEL = "DEBUG"

# Stripe (non-secret defaults)
[stripe]
STRIPE_API_KEY = "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"





# Admin Configuration
[admin]
USER_ADMIN = "admin@anvil.com"

ALLOWED_ADMIN_EMAILS = [
  "admin@anvil.com",
  "yordansolis2@gmail.com",
]

# Agent Squad Configuration
[agent_squad]
default_model = "gpt-4-turbo"
fallback_model = "gpt-3.5-turbo"
intent_threshold = 0.75
session_timeout = 3600
max_context_messages = 20
enable_intent_classification = true
enable_context_memory = true
enable_multi_agent_routing = true
debug_mode = false
log_intent_classification = true
log_agent_selection = true

# Privy Configuration
[privy]
APP_ID = "cmim36q4q02zwjr0cc9csypp7"
APP_SECRET = ""  # Set this in .secrets.toml or environment variable

# Integration Feature Flags
[integrations]

# Chat Integration
[integrations.chat]
enabled = true  # Master switch for chat integration
hunter_tools_enabled = true  # Enable Hunter AI tools (sentiment, prediction, risk, signals, portfolio, patterns)
ultra_tools_enabled = true  # Enable ULTRA tools (flash loans, arbitrage, MEV, auto-executor)
comprehensive_analysis_enabled = true  # Enable parallel multi-tool analysis
max_parallel_tools = 10  # Max tools to execute in parallel

# Project Integration
[integrations.projects]
enabled = true  # Master switch for project integration
templates_enabled = true  # Enable pre-built project templates
risk_validation_enabled = true  # Enable risk limit validation
tool_permissions_enabled = true  # Enable tool permission enforcement

# MCP Server Feature Flags
[mcp]
enabled = true

[distillation]
enabled = true  # Master switch (env: DISTILLATION_ENABLED)
provider = "vertex_ai"  # vertex_ai | deepinfra
fallback_provider = "deepinfra"
temperature = 0.3
max_tokens = 200
timeout_seconds = 5.0
fail_open = true  # Allow requests if distillation fails
rate_limit_per_user = 100  # Per minute
rate_limit_global = 10000  # Per minute

[distillation.vertex_ai]
project_id = "anvil-dev"
location = "us-central1"
credentials_path = ""  # Set via VERTEX_AI_CREDENTIALS_PATH
model = "gemini-1.5-flash"

[distillation.deepinfra]
api_key = ""  # Set via DEEPINFRA_API_KEY
model = "meta-llama/Llama-3.2-3B-Instruct"
base_url = "https://api.deepinfra.com/v1/openai"

[distillation.retry]
enabled = true
max_retries = 3
initial_backoff_seconds = 1.0
max_backoff_seconds = 5.0
exponential_base = 2.0

[distillation.telemetry]
enabled = true
async_recording = true
batch_size = 100
flush_interval_seconds = 60  # Master switch for all MCP servers

[mcp.servers]
defillama_enabled = true  # DeFiLlama TVL & protocol data (Free tier)
oneinch_enabled = true  # 1inch DEX aggregation (Paid API)
thegraph_enabled = true  # The Graph blockchain indexing (Paid API)
coingecko_enabled = true  # CoinGecko market data (Free tier)
aave_enabled = true  # Aave lending protocol integration
portfolio_enabled = true  # Portfolio tracking & analytics

# Agno Agent Feature Flags
[agno]
enabled = true  # Master switch for all Agno agents
intent_classification_enabled = true  # Auto-route queries to agents
fallback_to_general = true  # Fallback if agent disabled

[agno.agents]
trading_enabled = true  # Trade execution & strategy (1inch)
lending_enabled = true  # Lending/borrowing (Aave)
portfolio_enabled = true  # Portfolio optimization
analytics_enabled = true  # Data analysis & insights (DeFiLlama)

# Project Template Feature Flags
[projects]
enabled = true  # Master switch for project system
templates_enabled = true  # Master switch for pre-built templates

[projects.templates]
defi_swing_trader_enabled = true  # Intermediate swing trading
arbitrage_hunter_enabled = true  # Expert arbitrage (ULTRA tools)
ai_portfolio_manager_enabled = true  # Long-term portfolio management
conservative_investor_enabled = true  # Beginner-friendly, safe mode
day_trader_pro_enabled = true  # Expert day trading
