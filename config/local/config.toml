# ========================================
# Agent Squad Configuration (18 Agents)
# ========================================
[agent_squad]
# Master toggle (disable entire Agent Squad system)
enabled = true

# ========================================
# External API Feature Flags (Phase 7)
# ========================================
[agent_squad.external_apis]
# DeFi Data APIs (Week 1)
enable_1inch = true
enable_defillama = true
enable_coingecko = true
enable_hyperliquid = true
enable_uniswap = true
enable_curve = true
enable_aave = true

# Enterprise APIs (Week 2)
enable_chainalysis = false  # Requires paid license
enable_trm_labs = false     # Requires paid license
enable_gnosis_safe = true
enable_forta = true
enable_twilio = false       # Requires paid account

# Advanced APIs (Week 3)
enable_privy = false        # Requires app ID
enable_axelar = true
enable_layerzero = true
enable_opensea = false      # Requires API key
enable_snapshot = true

# Unified Chat Routing (Phase 8)
enable_unified_routing = true  # Enable intelligent intent-based routing
unified_routing_use_llm = true  # Use LLM for intent classification (fallback to keywords if false)

# Intent classification
intent_classification_model = "gemini-2.0-flash-exp"  # Fast model for routing
intent_confidence_threshold = 0.85  # Min confidence (0.0-1.0)
fallback_agent = "chat"  # Fallback if intent unclear

# GraphRAG routing
enable_graphrag_routing = true  # Route protocol/risk queries to GraphRAG

# Hunter AI routing (Phase 8.1)
enable_hunter_routing = true  # Route market intelligence queries to Hunter AI
enable_hunter_sentiment = true  # Sentiment analysis (Twitter, Reddit, Discord, News)
enable_hunter_price_prediction = true  # Price forecasting with ML models
enable_hunter_risk_signals = true  # Market risk warnings
enable_hunter_trading_signals = true  # Buy/sell signals
enable_hunter_patterns = true  # Chart pattern detection
enable_hunter_portfolio = true  # Portfolio optimization (MPT)

# ULTRA routing (Phase 8.2)
enable_ultra_routing = true  # Route DeFi automation queries to ULTRA
enable_ultra_arbitrage = true  # Arbitrage opportunity discovery
enable_ultra_flash_loans = true  # Flash loan protocol selection
enable_ultra_mev_protection = true  # MEV-protected execution via Flashbots
enable_ultra_auto_executor = true  # Automated trading bot control

# Supervisor coordination
enable_supervisor = true
supervisor_model = "gemini-2.0-flash-exp"  # Standard model for coordination
supervisor_max_agents = 5
supervisor_timeout_seconds = 120

# Context preservation
conversation_history_limit = 20  # Messages to keep
context_window_tokens = 8000  # Max tokens

# Performance
max_concurrent_agents = 3  # Parallel execution
routing_timeout_seconds = 5
execution_timeout_seconds = 60

# Storage
storage_backend = "postgresql"  # or "redis"
storage_ttl_seconds = 86400  # 24 hours

# Telemetry
telemetry_enabled = true
telemetry_sample_rate = 1.0  # 0.0-1.0

