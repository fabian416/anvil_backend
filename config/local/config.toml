# PostgreSQL
[postgres]
DB = "anvil_db"
HOST = "localhost"
PORT = 5432
DRIVER = "psycopg"

# Uvicorn
[uvicorn]
HOST = "0.0.0.0"
PORT = 9999

# SQLAlchemy
[sqla]
ECHO = false
ECHO_POOL = false
POOL_SIZE = 50
MAX_OVERFLOW = 10

# Logs
[logs]
# Level can be set to "DEBUG", "INFO", "WARNING", "ERROR", "CRITICAL"
LEVEL = "DEBUG"

# Stripe (non-secret defaults)
[stripe]
STRIPE_API_KEY = "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"





# Admin Configuration
[admin]
USER_ADMIN = "admin@anvil.com"

ALLOWED_ADMIN_EMAILS = [
  "admin@anvil.com",
  "yordansolis2@gmail.com",
]

# Agent Squad Configuration
[agent_squad]
default_model = "gpt-4-turbo"
fallback_model = "gpt-3.5-turbo"
intent_threshold = 0.75
session_timeout = 3600
max_context_messages = 20
enable_intent_classification = true
enable_context_memory = true
enable_multi_agent_routing = true
debug_mode = false
log_intent_classification = true
log_agent_selection = true

# Privy Configuration
[privy]
APP_ID = "cmim36q4q02zwjr0cc9csypp7"
APP_SECRET = ""  # Set this in .secrets.toml or environment variable

# Integration Feature Flags
[integrations]

# Chat Integration
[integrations.chat]
enabled = true  # Master switch for chat integration
hunter_tools_enabled = true  # Enable Hunter AI tools (sentiment, prediction, risk, signals, portfolio, patterns)
ultra_tools_enabled = true  # Enable ULTRA tools (flash loans, arbitrage, MEV, auto-executor)
comprehensive_analysis_enabled = true  # Enable parallel multi-tool analysis
max_parallel_tools = 10  # Max tools to execute in parallel

# Project Integration
[integrations.projects]
enabled = true  # Master switch for project integration
templates_enabled = true  # Enable pre-built project templates
risk_validation_enabled = true  # Enable risk limit validation
tool_permissions_enabled = true  # Enable tool permission enforcement
