name: Build & Push All Docker Images

on:
  push:
    branches:
      - master
      - main
      - staging
      - development
  # Allow manual builds
  workflow_dispatch:
    inputs:
      build_all:
        description: 'Build all services (yes/no)'
        required: false
        default: 'yes'

env:
  REGISTRY: ghcr.io
  REGISTRY_USERNAME: ${{ github.actor }}
  # Extract branch name: refs/heads/infra -> infra
  IMAGE_VERSION: ${{ github.ref_name }}

jobs:
  # Only build if tests passed (for workflow_run trigger) or manual dispatch
  build:
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          # Core Services (3)
          - service: fastapi
            dockerfile: docker/Dockerfile.fastapi
            image_name: anvil-backend-api
            
          - service: celery-beat
            dockerfile: docker/Dockerfile.celery-beat
            image_name: anvil-backend-celery-beat
            
          - service: celery-worker
            dockerfile: docker/Dockerfile.celery
            image_name: anvil-backend-celery-worker
          
          # Specialized Workers (9)
          - service: celery-worker-agents
            dockerfile: docker/Dockerfile.celery-workers.agents
            image_name: anvil-backend-celery-worker-agents
            
          - service: celery-worker-transactions
            dockerfile: docker/Dockerfile.celery-workers.transactions
            image_name: anvil-backend-celery-worker-transactions
            
          - service: celery-worker-graph
            dockerfile: docker/Dockerfile.celery-workers.graph
            image_name: anvil-backend-celery-worker-graph
            
          - service: celery-worker-distillation
            dockerfile: docker/Dockerfile.celery-workers.distillation
            image_name: anvil-backend-celery-worker-distillation
            
          - service: celery-worker-projects
            dockerfile: docker/Dockerfile.celery-workers.projects
            image_name: anvil-backend-celery-worker-projects
            
          - service: celery-worker-llm
            dockerfile: docker/Dockerfile.celery-workers.llm
            image_name: anvil-backend-celery-worker-llm
            
          - service: celery-worker-maintenance
            dockerfile: docker/Dockerfile.celery-workers.maintenance
            image_name: anvil-backend-celery-worker-maintenance
            
          - service: celery-worker-risk
            dockerfile: docker/Dockerfile.celery-workers.risk
            image_name: anvil-backend-celery-worker-risk
            
          - service: celery-worker-email
            dockerfile: docker/Dockerfile.celery-workers.email
            image_name: anvil-backend-celery-worker-email
          
          # MCP Servers (11)
          - service: mcp-1inch
            dockerfile: docker/Dockerfile.mcp
            image_name: anvil-backend-mcp-1inch
            build_args: MCP_SERVER=oneinch_mcp
            
          - service: mcp-defillama
            dockerfile: docker/Dockerfile.mcp
            image_name: anvil-backend-mcp-defillama
            build_args: MCP_SERVER=defillama_mcp
            
          - service: mcp-thegraph
            dockerfile: docker/Dockerfile.mcp
            image_name: anvil-backend-mcp-thegraph
            build_args: MCP_SERVER=thegraph_mcp
            
          - service: mcp-coingecko
            dockerfile: docker/Dockerfile.mcp
            image_name: anvil-backend-mcp-coingecko
            build_args: MCP_SERVER=coingecko_mcp
            
          - service: mcp-aave
            dockerfile: docker/Dockerfile.mcp
            image_name: anvil-backend-mcp-aave
            build_args: MCP_SERVER=aave_mcp
            
          - service: mcp-portfolio
            dockerfile: docker/Dockerfile.mcp
            image_name: anvil-backend-mcp-portfolio
            build_args: MCP_SERVER=portfolio_mcp
            
          - service: mcp-perplexity
            dockerfile: docker/Dockerfile.mcp
            image_name: anvil-backend-mcp-perplexity
            build_args: MCP_SERVER=perplexity_mcp
            
          - service: mcp-morpho
            dockerfile: docker/Dockerfile.mcp
            image_name: anvil-backend-mcp-morpho
            build_args: MCP_SERVER=morpho_mcp
            
          - service: mcp-curve
            dockerfile: docker/Dockerfile.mcp
            image_name: anvil-backend-mcp-curve
            build_args: MCP_SERVER=curve_mcp
            
          - service: mcp-hyperliquid
            dockerfile: docker/Dockerfile.mcp
            image_name: anvil-backend-mcp-hyperliquid
            build_args: MCP_SERVER=hyperliquid_mcp
            
          - service: mcp-layerzero
            dockerfile: docker/Dockerfile.mcp
            image_name: anvil-backend-mcp-layerzero
            build_args: MCP_SERVER=layerzero_mcp
          
          # Utilities (1)
          - service: tx-confirmation
            dockerfile: docker/Dockerfile.tx-confirmation
            image_name: anvil-backend-tx-confirmation
            
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image_name }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
            type=sha,format=short,prefix=sha-
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.service=${{ matrix.service }}

      - name: Build and Push - ${{ matrix.service }}
        timeout-minutes: 30
        run: |
          echo "=========================================="
          echo "Building ${{ matrix.service }}..."
          echo "=========================================="
          
          # Check disk space
          echo "Disk space before build:"
          df -h
          
          # Parse tags from metadata
          TAGS="${{ steps.meta.outputs.tags }}"
          PRIMARY_TAG=$(echo "$TAGS" | head -n1)
          echo "Primary tag: $PRIMARY_TAG"
          
          # Build with regular docker (more stable than buildx)
          docker build \
            --file ${{ matrix.dockerfile }} \
            --build-arg APP_ENV=${{ env.IMAGE_VERSION }} \
            ${{ matrix.build_args && format('--build-arg {0}', matrix.build_args) || '' }} \
            --tag "$PRIMARY_TAG" \
            --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} \
            --label org.opencontainers.image.service=${{ matrix.service }} \
            .
          
          # Tag with all required tags
          for tag in $TAGS; do
            if [ "$tag" != "$PRIMARY_TAG" ]; then
              echo "Tagging as: $tag"
              docker tag "$PRIMARY_TAG" "$tag"
            fi
          done
          
          # Push if this is a push event
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "Pushing images..."
            for tag in $TAGS; do
              echo "Pushing: $tag"
              docker push "$tag"
            done
          fi
          
          echo "Disk space after build:"
          df -h
          
          echo "✅ ${{ matrix.service }} completed successfully"

  build-summary:
    needs: build
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Build Summary
        run: |
          echo "✅ Build Summary"
          echo "================"
          echo "Status: ${{ needs.build.result }}"
          echo "Branch: ${{ github.ref }}"
          echo "Version: ${{ env.IMAGE_VERSION }}"
          echo ""
          echo "Built Services:"
          echo "  • FastAPI API"
          echo "  • Celery Beat"
          echo "  • Celery Worker (General)"
          echo "  • 9 Specialized Celery Workers"
          echo "  • 11 MCP Servers"
          echo "  • TX Confirmation"
          echo ""
          echo "Total: 24 Docker images"
          echo ""
          if [ "${{ needs.build.result }}" = "success" ]; then
            echo "🎉 All builds completed successfully!"
          else
            echo "⚠️ Some builds failed - check logs above"
          fi
