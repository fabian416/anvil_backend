    container_name: anvil_tx_confirmation
    environment:
      - APP_ENV=${APP_ENV}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
