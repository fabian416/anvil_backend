  # ===================================================
  # MONITORING - Flower (Celery Monitoring)
  # ===================================================
  
  flower:
    image: mher/flower:1.2.0
    container_name: anvil_flower
    environment:
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - FLOWER_BASIC_AUTH=${FLOWER_BASIC_AUTH}
      - FLOWER_URL_PREFIX=flower
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - anvil-network

  # ===================================================
  # FRONTEND WEBAPP
  # ===================================================
  frontend:
    image: ghcr.io/${GHCR_USERNAME}/anvil_frontend:${IMAGE_TAG:-production}
    container_name: frontend
    depends_on:
      fastapi:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - anvil-network

  # ===================================================
  # REVERSE PROXY - Caddy (HTTPS)
  # ===================================================
  
  caddy:
    image: caddy:latest
    container_name: anvil_caddy
    restart: unless-stopped
    depends_on:
      - fastapi
      - flower
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    networks:
      - anvil-network
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN=${DOMAIN:-dev.getrampy.com}
      - API_DOMAIN=${API_DOMAIN:-dev.getrampy.com}
      - FLOWER_DOMAIN=${FLOWER_DOMAIN}
      - FLOWER_USER=${FLOWER_USER}
      - FLOWER_HASH=${FLOWER_HASH}

volumes:
  pg_data:
  redis_data:
  celery_beat_schedule:
  caddy_data:
  caddy_config:

networks:
  anvil-network:
    driver: bridge