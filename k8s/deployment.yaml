apiVersion: apps/v1
kind: Deployment
metadata:
  name: defi-chat
  namespace: production
  labels:
    app: defi-chat
    version: v1
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: defi-chat
  template:
    metadata:
      labels:
        app: defi-chat
        version: v1
    spec:
      serviceAccountName: defi-chat
      
      initContainers:
      - name: migrate-database
        image: YOUR_DOCKER_USERNAME/defi-chat:latest
        command: ["alembic", "upgrade", "head"]
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: defi-chat-secrets
              key: database-url
        - name: APP_ENV
          value: "prod"
      
      containers:
      - name: app
        image: YOUR_DOCKER_USERNAME/defi-chat:latest
        imagePullPolicy: Always
        
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        
        env:
        - name: APP_ENV
          value: "prod"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: defi-chat-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: defi-chat-secrets
              key: redis-url
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: defi-chat-secrets
              key: jwt-secret
        - name: ONEINCH_API_KEY
          valueFrom:
            secretKeyRef:
              name: defi-chat-secrets
              key: oneinch-api-key
        - name: COINGECKO_API_KEY
          valueFrom:
            secretKeyRef:
              name: defi-chat-secrets
              key: coingecko-api-key
              optional: true
        
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        
        volumeMounts:
        - name: config
          mountPath: /app/config/prod
          readOnly: true
      
      volumes:
      - name: config
        configMap:
          name: defi-chat-config

---
apiVersion: v1
kind: Service
metadata:
  name: defi-chat
  namespace: production
  labels:
    app: defi-chat
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app: defi-chat

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: defi-chat-hpa
  namespace: production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: defi-chat
  minReplicas: 3
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: defi-chat
  namespace: production
