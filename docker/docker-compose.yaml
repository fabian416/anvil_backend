version: '3.8'

name: anvil-docker

services:
  # ===================================================
  # INFRAESTRUCTURA - PostgreSQL y Redis
  # ===================================================
  
  postgres:
    image: postgres:16-alpine
    container_name: anvil_postgres
    environment:
      POSTGRES_USER: anvil
      POSTGRES_PASSWORD: changethis
      POSTGRES_DB: anvil_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U anvil -d anvil_db" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - anvil-network

  redis:
    image: redis:7-alpine
    container_name: anvil_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - anvil-network

  # ===================================================
  # FASTAPI - API HTTP Server
  # ===================================================
  
  fastapi:
    build:
      context: .
      dockerfile: docker/Dockerfile.fastapi
    container_name: anvil_fastapi
    environment:
      - APP_ENV=local
      - DATABASE_URL=postgresql://anvil:changethis@postgres:5432/anvil_db
      - REDIS_URL=redis://redis:6379
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=anvil
      - POSTGRES_PASSWORD=changethis
      - POSTGRES_DB=anvil_db
      - POSTGRES_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./config/local/config.toml:/app/config/local/config.toml:ro
      - ./config/local/.env:/app/config/local/.env:ro
      - ./config/local/.secrets.toml:/app/config/local/.secrets.toml:ro
    restart: unless-stopped
    networks:
      - anvil-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ===================================================
  # CELERY - Background Job Processing
  # ===================================================
  
  # General Worker (all queues)
  celery-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.celery
    container_name: anvil_celery_worker
    environment:
      - APP_ENV=local
      - DATABASE_URL=postgresql://anvil:changethis@postgres:5432/anvil_db
      - REDIS_URL=redis://redis:6379
      - POSTGRES_HOST=postgres
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./config/local/config.toml:/app/config/local/config.toml:ro
      - ./config/local/.env:/app/config/local/.env:ro
      - ./config/local/.secrets.toml:/app/config/local/.secrets.toml:ro
    restart: unless-stopped
    networks:
      - anvil-network

  # Beat Scheduler
  celery-beat:
    build:
      context: .
      dockerfile: docker/Dockerfile.celery-beat
    container_name: anvil_celery_beat
    environment:
      - APP_ENV=local
      - DATABASE_URL=postgresql://anvil:changethis@postgres:5432/anvil_db
      - REDIS_URL=redis://redis:6379
      - POSTGRES_HOST=postgres
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./config/local/config.toml:/app/config/local/config.toml:ro
      - ./config/local/.env:/app/config/local/.env:ro
      - ./config/local/.secrets.toml:/app/config/local/.secrets.toml:ro
      - celery_beat_schedule:/tmp
    restart: unless-stopped
    networks:
      - anvil-network

